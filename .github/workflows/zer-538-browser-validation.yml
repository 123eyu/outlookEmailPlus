name: ZER-538 browser validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-validation:
    name: Browser desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ant-design-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ant-design-pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Install browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          nohup npm run preview >/tmp/zer-538-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zer-538-preview.log
          exit 1

      - name: Validate desktop and mobile states
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, statSync } from 'node:fs';
          import { chromium } from 'playwright';

          mkdirSync('browser-artifacts', { recursive: true });

          const mailboxes = [
            {
              email: 'native@gptmail.example',
              provider_name: 'gptmail',
              compatibility_mode: 'native',
              read_capability: 'provider',
            },
            {
              email: 'plugin@corp.example',
              provider_name: 'corp_plugin',
              compatibility_mode: 'native',
              read_capability: 'provider',
            },
            {
              email: 'history@gptmail.example',
              provider_name: 'legacy_gptmail',
              compatibility_mode: 'legacy',
              read_capability: 'legacy_bridge',
            },
          ];

          const providers = [
            {
              name: 'gptmail',
              label: 'GPTMail',
              kind: 'builtin',
              active: true,
              selected: true,
            },
            {
              name: 'corp_plugin',
              label: '企业临时邮箱插件',
              kind: 'plugin',
              active: false,
              selected: false,
            },
          ];

          const readyOptions = {
            domains: [{ name: 'gptmail.example', enabled: true }],
            providers,
            provider_name: 'gptmail',
            provider_label: 'GPTMail',
            provider_kind: 'builtin',
            active_provider: 'gptmail',
            enabled: true,
            configured: true,
            status: 'ready',
            status_message: 'GPTMail 临时邮箱已启用，可直接生成和读取邮件。',
            capabilities: {
              create_mailbox: true,
              list_messages: true,
              get_message_detail: true,
              delete_mailbox: false,
              delete_message: false,
              clear_messages: true,
            },
          };

          const disabledOptions = {
            domains: [],
            providers,
            provider_name: 'corp_plugin',
            provider_label: '企业临时邮箱插件',
            provider_kind: 'plugin',
            active_provider: 'corp_plugin',
            enabled: true,
            configured: false,
            status: 'not_configured',
            status_message: '企业临时邮箱插件尚未配置，请先完成插件设置。',
            capabilities: {
              create_mailbox: true,
              list_messages: true,
              get_message_detail: true,
              delete_mailbox: true,
              delete_message: true,
              clear_messages: true,
            },
          };

          async function renderState(browser, mode, viewport, filename) {
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));

            await page.route('**/api/**', async (route) => {
              const path = new URL(route.request().url()).pathname;
              let payload;

              if (path === '/api/auth/current-user') {
                payload = {
                  success: true,
                  data: {
                    name: 'ZER-538 验收用户',
                    userid: 'zer-538',
                    access: 'admin',
                  },
                };
              } else if (path === '/api/csrf-token') {
                payload = { csrf_disabled: true };
              } else if (path === '/api/temp-emails/options') {
                payload = {
                  success: true,
                  options: mode === 'ready' ? readyOptions : disabledOptions,
                };
              } else if (path === '/api/temp-emails') {
                payload = { success: true, emails: mailboxes };
              } else if (path.includes('/messages')) {
                payload = { success: true, emails: [] };
              } else {
                payload = { success: true, data: {} };
              }

              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify(payload),
              });
            });

            await page.goto('http://127.0.0.1:8000/temp-emails', {
              waitUntil: 'domcontentloaded',
            });
            await page.getByText('临时邮箱服务', { exact: true }).waitFor({
              state: 'visible',
              timeout: 30000,
            });

            assert.equal(
              new URL(page.url()).pathname,
              '/temp-emails',
              '页面不应重定向到登录页',
            );
            await page.getByText('临时邮箱', { exact: true }).first().waitFor();
            await page.getByText('GPTMail', { exact: true }).first().waitFor();
            await page.getByText('插件', { exact: true }).first().waitFor();
            await page.getByText('历史兼容', { exact: true }).waitFor();

            const generateButton = page.getByRole('button', { name: '生成', exact: true });
            if (mode === 'ready') {
              await page.getByText('已启用', { exact: true }).waitFor();
              assert.equal(await generateButton.isEnabled(), true);
            } else {
              await page.getByText('需配置', { exact: true }).waitFor();
              await page.getByText('企业临时邮箱插件尚未配置，请先完成插件设置。').waitFor();
              assert.equal(await generateButton.isDisabled(), true);
            }

            const overflow = await page.evaluate(() => ({
              viewport: window.innerWidth,
              body: document.body.scrollWidth,
              document: document.documentElement.scrollWidth,
            }));
            assert.ok(
              overflow.body <= overflow.viewport + 2,
              'body 出现横向溢出: ' + JSON.stringify(overflow),
            );
            assert.ok(
              overflow.document <= overflow.viewport + 2,
              'document 出现横向溢出: ' + JSON.stringify(overflow),
            );

            const output = 'browser-artifacts/' + filename;
            await page.screenshot({ path: output, fullPage: true });
            assert.ok(statSync(output).size > 10000, '截图文件异常为空');
            assert.deepEqual(pageErrors, []);
            await context.close();
          }

          const browser = await chromium.launch({ headless: true });
          try {
            await renderState(
              browser,
              'ready',
              { width: 1440, height: 1000 },
              'temp-email-ready-desktop.png',
            );
            await renderState(
              browser,
              'disabled',
              { width: 390, height: 844 },
              'temp-email-not-configured-mobile.png',
            );
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zer-538-browser-evidence
          path: ant-design-pro/browser-artifacts
          if-no-files-found: error
