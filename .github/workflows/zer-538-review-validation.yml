name: ZER-538 review validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-validation:
    name: Frontend lint typecheck tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ant-design-pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ant-design-pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run biome:lint

      - name: Type check
        run: npm run tsc

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
