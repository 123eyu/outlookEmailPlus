name: ZER-538 Frontend Validation

on:
  pull_request:
    branches:
      - cursor/zer-381-frontend-polish-b985
    paths:
      - "ant-design-pro/**"
      - ".github/workflows/zer-538-frontend-validation.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ant-design-pro
    env:
      HUSKY: "0"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ant-design-pro/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run biome:lint

      - name: Type check
        run: npm run tsc

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
