name: Frontend Quality

on:
  pull_request:
    paths:
      - "ant-design-pro/**"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ant-design-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ant-design-pro/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run biome:lint
      - name: Type check
        run: npm run tsc
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
